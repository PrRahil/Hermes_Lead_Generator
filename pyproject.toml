[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-lead-machine"
version = "0.1.0"
description = "Local Hermes-style lead generation agent for Tech/Data/AI work"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "jinja2>=3.1.4",
  "aiofiles>=24.1.0",
  "email-validator>=2.2.0",
  "rich>=13.9.0",
  "typer>=0.12.5",
  "feedparser>=6.0.11",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "python-multipart>=0.0.12",
  "openai>=1.54.0",
  "orjson>=3.10.0",
]

[project.scripts]
hermes-leads = "hermes.__main__:app"

[tool.setuptools.packages.find]
include = ["hermes*"]

[tool.setuptools.package-data]
hermes = ["static/*"]